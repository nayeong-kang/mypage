<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설비 이상 감시 시스템</title>
<style>

  --green:#2F7A3B; --greenbg:#E5F1E4; --amber:#9A6200; --amberbg:#FCF1DA; --red:#A3322A; --redbg:#F8E1DD; --gray:#6B7280; --graybg:#ECEEF1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}

.lg{width:420px;background:#fff;border:1px solid var(--line);padding:34px 36px}
.lg h1{margin:0 0 4px;font-size:22px;color:var(--navy)}
.lg p{margin:0 0 22px;color:var(--sub);font-size:13.5px}
.lg label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
.lg input,.lg select{width:100%;padding:11px 12px;border:1px solid var(--line);font-size:15px;font-family:inherit}
.lg .btn{width:100%;margin-top:22px;padding:13px;background:var(--navy);color:#fff;border:0;font-size:16px}
.lg .hint{margin-top:14px;font-size:12px;color:var(--sub)}
/* app */
header{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 22px;height:58px}
header .t{font-size:18px;font-weight:700}
header .t small{font-weight:400;opacity:.8;font-size:13px;margin-left:10px}
.user{display:flex;gap:16px;align-items:center;font-size:13px}
.user .chip{background:rgba(255,255,255,.12);padding:5px 10px}
.user b{font-size:14px}
.user button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:5px 10px;font-size:12.5px}
nav{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:4px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 16px;font-size:15px;color:var(--sub)}
nav button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
nav .badge{background:var(--red);color:#fff;font-size:11px;padding:1px 6px;margin-left:5px;border-radius:9px}
main{padding:20px 22px}
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sum{background:#fff;border:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.sum .n{font-size:28px;font-weight:700}
.sum .l{font-size:14px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grp{font-size:14px;font-weight:700;color:var(--navy);margin:18px 0 8px}
.card .row2{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--sub)}
.card .row2 b{color:var(--ink)}
.fa{display:inline-block;padding:2px 8px;font-size:12.5px;font-weight:700;border:1px solid var(--line)}
.fa-wait{color:var(--sub)} .fa-ok{color:#fff;background:var(--green);border-color:var(--green)} .fa-hold{color:#fff;background:var(--red);border-color:var(--red)} .fa-rev{color:#fff;background:#9A6200;border-color:#9A6200}
.why{width:100%;border-collapse:collapse;margin-top:4px}
.why td{padding:9px 8px;border-bottom:1px solid #EEF1F4;font-size:14px;vertical-align:top}
.why td.k{width:34%;color:var(--sub)} .why td.r{width:22%;text-align:right;font-weight:700}
.pass{color:var(--green)} .fail{color:var(--red)} .warn{color:var(--amber)} .skip{color:var(--gray)}
.fbtn{display:flex;gap:8px;margin-top:10px} .fbtn button{flex:1;padding:11px 6px;font-size:14.5px;border:1px solid var(--navy);background:#fff;color:var(--navy)} .fbtn button.p{background:var(--navy);color:#fff} .fbtn button:disabled{opacity:.35;cursor:not-allowed}
.sep{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
.sep .st2{flex:1;border:1px solid var(--line);background:#fff;padding:12px 14px}
.sep .st2 .h{font-size:12.5px;color:var(--sub)} .sep .st2 .v{font-size:19px;font-weight:700;margin-top:4px}
.sep .arr{display:flex;align-items:center;color:var(--sub);font-size:22px}
.card{background:#fff;border:1px solid var(--line);padding:14px 16px;cursor:pointer;border-top:4px solid var(--gray)}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card .nm{font-size:17px;font-weight:700}
.card .loc{font-size:12.5px;color:var(--sub);margin-top:2px}
.card .st{display:inline-block;margin-top:12px;padding:4px 10px;font-weight:700;font-size:14px}
.card .msg{font-size:13px;color:var(--ink);margin-top:8px;line-height:1.45;min-height:38px}
.card .tm{font-size:11.5px;color:var(--sub);margin-top:8px}
.ok{color:var(--green);background:var(--greenbg)} .bo-ok{border-top-color:var(--green)}
.rv{color:var(--amber);background:var(--amberbg)} .bo-rv{border-top-color:#D99A1E}
.hd{color:var(--red);background:var(--redbg)} .bo-hd{border-top-color:var(--red)}
.na{color:var(--gray);background:var(--graybg)} .bo-na{border-top-color:var(--gray)}
/* detail */
.back{background:none;border:0;color:var(--navy);font-size:14px;padding:0;margin-bottom:12px}
.banner{padding:16px 20px;border:1px solid;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.banner .big{font-size:21px;font-weight:700}
.banner .exp{font-size:15px;margin-top:6px;line-height:1.5}
.banner .acts{display:flex;gap:8px;flex-shrink:0}
.b1{background:var(--navy);color:#fff;border:0;padding:12px 18px;font-size:15px}
.b2{background:#fff;color:var(--navy);border:1px solid var(--navy);padding:12px 18px;font-size:15px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.box{background:#fff;border:1px solid var(--line);padding:14px 16px}
.box h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.info td{padding:7px 4px;border-bottom:1px solid #EEF1F4;font-size:14px}
.info td:first-child{color:var(--sub);width:42%}
.steps li{margin:6px 0;font-size:14px;line-height:1.45}
.legend{font-size:12px;color:var(--sub);margin-top:4px}
/* voe */
.modal{position:fixed;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:center;justify-content:center}
.mbox{background:#fff;width:560px;padding:24px 26px}
.mbox h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.mbox .s{color:var(--sub);font-size:13px;margin-bottom:14px}
.opt{display:block;border:1px solid var(--line);padding:11px 12px;margin:7px 0;font-size:15px;cursor:pointer}
.opt input{margin-right:8px}
textarea{width:100%;height:80px;border:1px solid var(--line);padding:10px;font-family:inherit;font-size:14px;margin-top:8px}
.mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
table.lst{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
table.lst th,table.lst td{padding:11px 12px;border-bottom:1px solid #EEF1F4;text-align:left;font-size:14px}
table.lst th{background:#F7F8FA;color:var(--sub);font-weight:600}

.note{font-size:12px;color:var(--sub);margin-top:12px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;font-size:14px}
.tool{display:flex;gap:10px;align-items:center;margin:4px 0 6px;flex-wrap:wrap}
.tool input{padding:9px 12px;border:1px solid var(--line);font-size:14px;width:240px;font-family:inherit}
.tool select{padding:8px 10px;border:1px solid var(--line);font-size:14px;font-family:inherit;background:#fff}

.last{font-size:12px;color:var(--red);font-weight:700}

</head>

function strip(e,j){
  const w=820,h=170,v=e.seeds,lo=Math.min(-0.06,...v)-0.01,hi=Math.max(0.06,...v)+0.01;
  const X=i=>44+i*(w-64)/Math.max(1,v.length-1), Y=x=>h-24-(x-lo)/(hi-lo)*(h-46);
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
   <line x1="44" x2="${w-20}" y1="${Y(0)}" y2="${Y(0)}" stroke="#1E2430" stroke-width="1"/>
   <line x1="44" x2="${w-20}" y1="${Y(-DEL)}" y2="${Y(-DEL)}" stroke="#A3322A" stroke-dasharray="5 4"/>
   <text x="48" y="${Y(-DEL)+14}" font-size="12" fill="#A3322A">허용 저하 −δ = −${DEL.toFixed(3)}</text>
   <line x1="44" x2="${w-20}" y1="${Y(j.m)}" y2="${Y(j.m)}" stroke="#2F7A3B" stroke-dasharray="2 3"/>
   <text x="${w-20}" y="${Y(j.m)-6}" font-size="12" fill="#2F7A3B" text-anchor="end">평균 ΔĀ = ${f3(j.m)}</text>
   <text x="38" y="${Y(0)+4}" font-size="10" fill="#5B6575" text-anchor="end">0</text>`;
  v.forEach((x,i)=>{s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(0)}" y2="${Y(x)}" stroke="${x<-DEL?'#A3322A':'#2E4D75'}" stroke-width="7"/>`;});
  s+=`<text x="44" y="${h-6}" font-size="10.5" fill="#5B6575">반복 1</text><text x="${w-20}" y="${h-6}" font-size="10.5" fill="#5B6575" text-anchor="end">반복 ${v.length}</text></svg>`;
  return s;
}

  $('#vc').onclick=()=>$('#modal').classList.add('hide');
  $('#vs').onclick=()=>{const k=document.querySelector('input[name=k]:checked').value;
    VOE.unshift({no:"VOE-"+(1031+VOE.length),eq:e.nm,k,t:$('#vt').value||"(내용 없음)",by:$('#u-name').textContent,st:"접수",tm:new Date().toTimeString().slice(0,5)});
    $('#modal').classList.add('hide'); $('#vcnt').textContent=VOE.length; toast('조치 요청이 접수되었습니다. 처리 결과는 \'조치 요청 내역\'에서 볼 수 있습니다.');};
}
function renderVoe(){
  const P={"접수":"p1","검토 중":"p2","운영 재개(Release)":"p3","고장 판정":"p4","Adapter 재학습":"p2"};
  let h=`<table class="lst"><tr><th>요청 번호</th><th>설비</th><th>요청 내용</th><th>요청자</th><th>시각</th><th>처리 상태</th>${ROLE==='eng'?'<th>엔지니어 처리</th>':''}</tr>`;
  if(!VOE.length) h+=`<tr><td colspan="7" style="color:var(--sub)">아직 보낸 조치 요청이 없습니다.</td></tr>`;
  VOE.forEach((v,i)=>{h+=`<tr><td>${v.no}</td><td>${v.eq}</td><td><b>${v.k}</b><br><span style="color:var(--sub)">${v.t}</span></td><td>${v.by}</td><td>${v.tm}</td><td><span class="pill ${P[v.st]}">${v.st}</span></td>
   ${ROLE==='eng'?`<td class="eng"><button data-i="${i}" data-s="운영 재개(Release)">Release</button><button data-i="${i}" data-s="고장 판정">고장 판정</button><button data-i="${i}" data-s="Adapter 재학습">재학습</button></td>`:''}</tr>`});
  $('#v-voe').innerHTML=h+'</table><div class="note">작업자가 보낸 요청은 모델 담당 엔지니어가 확인한 뒤 운영 재개(Release), 고장 판정, Adapter 재학습 중 하나로 처리합니다. 처리한 요청도 목록에 그대로 남습니다.</div>';
  document.querySelectorAll('.eng button').forEach(b=>b.onclick=()=>{VOE[+b.dataset.i].st=b.dataset.s;renderVoe();});
}
function donut(parts){
  const tot=parts.reduce((a,p)=>a+p[1],0)||1; let a0=-Math.PI/2, o='';
  parts.forEach(([l,v,c])=>{if(!v)return;const a1=a0+2*Math.PI*v/tot,L=a1-a0>Math.PI?1:0;
   o+=`<path d="M${80+60*Math.cos(a0)} ${80+60*Math.sin(a0)} A60 60 0 ${L} 1 ${80+60*Math.cos(a1)} ${80+60*Math.sin(a1)}" stroke="${c}" stroke-width="22" fill="none"/>`;a0=a1;});
  return `<svg viewBox="0 0 330 160" width="100%" height="160">${o}<text x="80" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#1E2430">${tot}</text><text x="80" y="96" text-anchor="middle" font-size="11" fill="#5B6575">설비</text>
   ${parts.map(([l,v,c],k)=>`<rect x="170" y="${28+k*26}" width="12" height="12" fill="${c}"/><text x="188" y="${38+k*26}" font-size="12.5" fill="#1E2430">${l} ${v}</text>`).join('')}</svg>`;
}
function sbars(){
  const ev=E.map(e=>({e,j:judge(e)})).filter(x=>x.j.c!=='na'), w=760,h=190, lo=-0.08, hi=0.2;
  const X=k=>50+k*(w-70)/ev.length, Y=v=>h-28-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(h-48), bw=(w-70)/ev.length*0.6;
  let o=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="50" x2="${w-10}" y1="${Y(0)}" y2="${Y(0)}" stroke="#1E2430"/>
   <line x1="50" x2="${w-10}" y1="${Y(TAU)}" y2="${Y(TAU)}" stroke="#2F7A3B" stroke-dasharray="5 4"/><text x="${w-12}" y="${Y(TAU)-5}" font-size="11.5" fill="#2F7A3B" text-anchor="end">기준 점수 τ = ${TAU.toFixed(3)}</text>
   <text x="44" y="${Y(0)+4}" font-size="10" fill="#5B6575" text-anchor="end">0</text><text x="44" y="${Y(0.1)+4}" font-size="10" fill="#5B6575" text-anchor="end">0.1</text>`;
  ev.forEach((x,k)=>{const c={ok:'#2F7A3B',rv:'#D99A1E',hd:'#A3322A'}[x.j.c];o+=`<rect x="${X(k)}" y="${Math.min(Y(0),Y(x.j.S))}" width="${bw}" height="${Math.abs(Y(0)-Y(x.j.S))}" fill="${c}"/>
   <text x="${X(k)+bw/2}" y="${h-8}" font-size="9.5" fill="#5B6575" text-anchor="middle">${x.e.nm.replace(/^(보일러|SMD|MSL) /,'')}</text>`;});
  return o+`<text x="50" y="14" font-size="11.5" fill="#5B6575">평가 가능 14개 설비의 승인 점수 S (색: 자동 판정)</text></svg>`;
}
function renderStat(){
  const J=E.map(judge), ev=J.filter(j=>j.c!=='na'), fin=k=>E.filter(e=>FA[e.id]===k).length;
  const mA=ev.reduce((a,j)=>a+j.m,0)/ev.length, mD=Math.max(...ev.map(j=>j.D));
  let h=`<div class="meta">판정 갱신 ${UPD}</div><div class="kpis">
   <div class="kpi"><div class="h">평가 가능 설비 (G = 1)</div><div class="v">${ev.length} / ${E.length}</div><div class="d">누수 제거 후 이상·정상이 모두 남은 조합</div></div>
   <div class="kpi"><div class="h">평균 성능 변화 ΔĀ</div><div class="v">${f3(mA)}</div><div class="d">평가 가능 설비 평균 (AUROC)</div></div>
   <div class="kpi"><div class="h">최대 성능 저하 D (최악 설비)</div><div class="v" style="color:var(--red)">${mD.toFixed(3)}</div><div class="d">허용 δ = ${DEL.toFixed(3)} 초과 설비 ${J.filter(j=>j.c==='hd').length}개</div></div>
   <div class="kpi"><div class="h">작업자 최종 승인 대기</div><div class="v" style="color:var(--navy)">${E.filter((e,i)=>FA[e.id]==='대기'&&(J[i].c==='ok'||J[i].c==='rv')).length}</div><div class="d">점수 통과·검토 대상 중 미결정</div></div></div>
   <div class="dash"><div class="box"><h3>작업자 최종 결정 비율</h3>${donut([["승인",fin('승인'),'#2F7A3B'],["보류",fin('보류'),'#A3322A'],["수정 요청",fin('수정 요청'),'#9A6200'],["대기",fin('대기'),'#C9CFD8']])}</div>
    <div class="box"><h3>설비별 승인 점수</h3>${sbars()}</div></div>
   <div class="stat"><div class="formula">(1) G = 1[n⁺ &gt; 0 ∧ n⁻ &gt; 0] &nbsp;→&nbsp; (2) D = max(0, −min<sub>k</sub>(A<sub>k</sub> − A⁰)) ≤ δ &nbsp;→&nbsp; (3) S = G·(ΔĀ − λD) ≥ τ &nbsp;&nbsp;&nbsp;
   <span style="font-family:inherit;color:#5B6575;font-size:13px">시연용 기준: τ = ${TAU.toFixed(3)}, δ = ${DEL.toFixed(3)}, λ = ${LAM}</span></div>
   <table class="lst"><tr><th>설비 (적응 조합)</th><th>G</th><th>남은 이상/정상</th><th>K</th><th>ΔĀ</th><th>D</th><th>S</th><th>① 자동 판정</th><th>② 작업자 최종 승인</th></tr>`;
  E.forEach(e=>{const j=judge(e);h+=`<tr><td>${e.nm}</td><td>${j.G}</td><td>${e.np.toLocaleString()} / ${e.nn.toLocaleString()}</td><td>${j.K||'—'}</td>
   <td>${j.m!==undefined?f3(j.m):'—'}</td><td>${j.D!==undefined?j.D.toFixed(3):'—'}</td>
   <td>${j.S!==undefined?f3(j.S):'—'}</td><td><span class="pill ${{ok:'p3',rv:'p2',hd:'p4',na:'p1'}[j.c]}">${j.lab}</span></td><td><span class="fa ${FAC[FA[e.id]]}">${FA[e.id]}</span></td></tr>`});
  $('#v-stat').innerHTML=h+'</table><div class="note">엔지니어 전용 화면입니다. 수치: Adapter(1%) · 누수 제거 후 AUROC · 반복 K회 (본 연구 실험 결과).</div></div>';
}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.remove('hide');setTimeout(()=>x.classList.add('hide'),2600)}
$('#go').onclick=()=>{
  ROLE=$('#role').value; $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#u-time').textContent=new Date().toTimeString().slice(0,5);
  if(ROLE==='eng'){$('#u-name').textContent='이서준';$('#u-role').textContent='엔지니어';$('#u-team').textContent='모델운영팀';$('#tab-stat').classList.remove('hide');}
  else{$('#u-name').textContent='김현우';$('#u-role').textContent='작업자';$('#u-team').textContent='분임조: 보일러 3조';$('#tab-stat').classList.add('hide');}
  show('list');
};
$('#logout').onclick=()=>{$('#app').classList.add('hide');$('#login').classList.remove('hide');};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
</script>
</body>
